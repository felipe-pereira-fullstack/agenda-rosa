<div class="main-wrapper">
  <p-toast key="cadastro" position="bottom-center" />

  <div class="login-page">
    <div class="login-box">
      <div class="container-titles">
        <img class="login-logo" src="/img/logoRosa.png" alt="Logo Agenda Rosa" />
        <h1 class="title">Criar <span class="title-gradient">Conta!</span></h1>
        <h2 class="subtitle">Cadastre-se para começar.</h2>
      </div>

      <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <p-floatlabel variant="on" class="float-field">
            <i class="pi pi-user p-inputicon field-icon" aria-hidden="true"></i>
            <input
              id="usuario"
              type="text"
              pInputText
              formControlName="usuario"
              class="rounded-input"
              autocomplete="username"
            />
            <label for="usuario">Usuário</label>
          </p-floatlabel>
        </div>

        <div class="field">
          <p-floatlabel variant="on" class="float-field">
            <i class="pi pi-envelope p-inputicon field-icon" aria-hidden="true"></i>
            <input
              id="email"
              type="email"
              pInputText
              formControlName="email"
              class="rounded-input"
              autocomplete="email"
            />
            <label for="email">E-mail</label>
          </p-floatlabel>
        </div>

        <div class="field">
          <p-floatlabel variant="on" class="float-field">
            <i class="pi pi-unlock p-inputicon field-icon" aria-hidden="true"></i>
            <p-password
              inputId="senha"
              formControlName="senha"
              [feedback]="false"
              [toggleMask]="true"
              [autofocus]="false"
              inputStyleClass="rounded-input"
              styleClass="password-wrapper"
              autocomplete="current-password"
            ></p-password>
            <label for="senha">Senha</label>
          </p-floatlabel>
        </div>

        <button
          pButton
          type="submit"
          [label]="loading ? 'Cadastrando...' : 'Criar conta'"
          [disabled]="loading"
          class="login-button p-button-rounded"
        ></button>
      </form>

      <div class="create-account">
        <p>
          Já possui uma conta? <a class="create-account-link" routerLink="/login">Entre clicando aqui!</a>
        </p>
      </div>
    </div>
  </div>
</div>
