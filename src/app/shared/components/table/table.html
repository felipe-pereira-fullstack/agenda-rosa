<div class="table-container">

  <div
    *ngIf="agendamentos.length === 0"
    class="empty-message"
    [class.empty-message--highlighted]="vazioDestacado"
    role="status"
  >
    <i *ngIf="vazioDestacado" class="pi pi-calendar-times" aria-hidden="true"></i>
    <span>Sem agendamentos ainda.</span>
  </div>

  <p-table
    *ngIf="agendamentos.length > 0"
    [value]="agendamentos"
    styleClass="custom-agenda-table">

    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>Hora</th>
        <th>Serviços</th>
        <th *ngIf="mostrarAcoes" class="acoes-header">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-agendamento let-rowIndex="rowIndex">
      <tr [ngClass]="{'row-dark': rowIndex % 2 === 0, 'row-light': rowIndex % 2 !== 0}">
        <td>{{ agendamento.nome }}</td>
        <td>{{ agendamento.hora }}</td>
        <td>{{ agendamento.servico }}</td>

        <td *ngIf="mostrarAcoes" class="acoes-cell">
          <div class="acoes-content">
            <button
              class="btn-edit"
              (click)="clicouEditar(agendamento)"
              title="Editar Agendamento">
              <i class="pi pi-pencil"></i>
            </button>
            <button
              class="btn-delete"
              (click)="clicouDeletar(agendamento)"
              title="Deletar Agendamento">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>
