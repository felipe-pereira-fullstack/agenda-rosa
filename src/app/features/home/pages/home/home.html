<app-header titulo="Início"></app-header>

<div class="main-content">
  <section class="today-section">
    <h2 class="section-title">Agendamentos de hoje <span>({{ diaAtual }})</span></h2>
    <app-agendamentos-table
      [agendamentos]="agendamentosDoDia"
      [mostrarAcoes]="false"
    ></app-agendamentos-table>
  </section>

  <section class="upcoming-section">
    <h2 class="section-title section-title--upcoming">Agendamentos da semana</h2>
    <app-mini-calendar></app-mini-calendar>
  </section>
</div>

<app-footer></app-footer>
