<header class="app-header">
  <div class="logo-container">
    <button
      class="logo-button"
      type="button"
      aria-label="Ir para o início"
      title="Início"
      (click)="irParaHome()"
    >
      <img src="/img/logoBranca.png" alt="Agenda Rosa" class="header-logo">
    </button>
  </div>

  <div class="title-container">
    <h1>{{ titulo }}</h1>
  </div>

  <div class="menu-container">
    <button
      class="hamburger-btn"
      type="button"
      aria-label="Abrir menu"
      title="Menu"
      (click)="menu.toggle($event)"
    >
      <span class="hamburger-lines" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <p-menu
      #menu
      [model]="menuItems"
      [popup]="true"
      styleClass="header-account-menu"
    ></p-menu>
  </div>
</header>

<p-dialog
  header="Sair do sistema"
  [visible]="modalSaidaVisivel"
  (visibleChange)="aoAlterarVisibilidadeSaida($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saindo"
  [closeOnEscape]="!saindo"
  [dismissableMask]="!saindo"
  [style]="{ width: 'min(360px, calc(100vw - 40px))' }"
  styleClass="logout-dialog"
>
  <div class="logout-confirmation">
    <span class="logout-icon" aria-hidden="true">
      <i class="pi pi-sign-out"></i>
    </span>
    <p>Tem certeza de que deseja sair do sistema?</p>
  </div>

  @if (erroSaida) {
    <p class="logout-error" role="alert">{{ erroSaida }}</p>
  }

  <div class="logout-actions">
    <button
      class="confirm-logout-button"
      type="button"
      [disabled]="saindo"
      (click)="confirmarSaida()"
    >
      {{ saindo ? 'Saindo...' : 'Sim, sair' }}
    </button>
    <button
      class="cancel-logout-button"
      type="button"
      [disabled]="saindo"
      (click)="cancelarSaida()"
    >
      Cancelar
    </button>
  </div>
</p-dialog>
